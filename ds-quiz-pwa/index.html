<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duales Studium">
<meta name="theme-color" content="#000000">
<title>Duales Studium</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* macOS inspired design system */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{
  --bg:#000;--bg-1:#0a0a0f;--bg-2:#14141a;
  --surface:rgba(255,255,255,.06);--surface-2:rgba(255,255,255,.1);--surface-3:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.14);
  --text:rgba(255,255,255,.95);--text-2:rgba(255,255,255,.6);--text-3:rgba(255,255,255,.35);
  --accent:#0a84ff;--accent-2:#5ac8fa;
  --ok:#30d158;--warn:#ff9f0a;--no:#ff453a;--pink:#ff375f;--purple:#bf5af2;
}
body{background:#000;color:var(--text);font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,sans-serif;overflow-x:hidden;letter-spacing:-0.01em;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 10% -10%,rgba(10,132,255,.15),transparent 45%),radial-gradient(circle at 90% 0%,rgba(191,90,242,.12),transparent 45%),radial-gradient(circle at 50% 110%,rgba(255,55,95,.1),transparent 45%),#000}
input,textarea,button{font-family:inherit;-webkit-appearance:none;color:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}input[type=number]{-moz-appearance:textfield}

@keyframes si{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pi{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
.si{animation:si .5s cubic-bezier(.22,1,.36,1) forwards}
.pi{animation:pi .35s cubic-bezier(.34,1.56,.64,1) forwards}
.pulse{animation:pulse .8s cubic-bezier(.4,0,.2,1)}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
.glow{animation:glow 2s ease-in-out infinite}

.w{min-height:100vh;padding:calc(20px + env(safe-area-inset-top,0)) calc(16px + env(safe-area-inset-right,0)) calc(110px + env(safe-area-inset-bottom,0)) calc(16px + env(safe-area-inset-left,0))}
.ct{max-width:560px;margin:0 auto}

.cd{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-radius:22px;padding:26px 22px;border:.5px solid rgba(255,255,255,.12);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 20px 50px -10px rgba(0,0,0,.5)}

.b{border:none;border-radius:14px;padding:14px 22px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s cubic-bezier(.22,1,.36,1),filter .15s,background .2s;letter-spacing:-0.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.b:active{transform:scale(.96);filter:brightness(.9)}
.bg{background:var(--surface);color:var(--text);border:.5px solid var(--border-2);backdrop-filter:blur(20px);border-radius:14px;padding:14px 22px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.bg:active{transform:scale(.96)}
.bs{padding:7px 14px;font-size:13px;font-weight:600;background:var(--surface);border:.5px solid var(--border-2);color:var(--text-2);border-radius:10px;cursor:pointer;transition:all .15s}
.bs:active{transform:scale(.95)}

.qi{width:100%;background:var(--surface);border:.5px solid var(--border-2);border-radius:14px;padding:16px 18px;font-size:16px;color:var(--text);outline:none;transition:all .2s cubic-bezier(.22,1,.36,1)}
.qi::placeholder{color:var(--text-3)}
.qi:focus{background:var(--surface-2);border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,.2)}
.qt{width:100%;background:var(--surface);border:.5px solid var(--border-2);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--text);outline:none;resize:none;min-height:90px;line-height:1.5;transition:all .2s}
.qt:focus{background:var(--surface-2);border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,.2)}

.mc{width:100%;background:var(--surface);border:.5px solid var(--border);border-radius:14px;padding:16px 18px;font-size:15px;color:var(--text);cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;transition:all .2s cubic-bezier(.22,1,.36,1)}
.mc:active:not(:disabled){transform:scale(.99)}
.ml{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:var(--text-2);transition:all .2s}

.bn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(20,20,26,.7);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:.5px solid rgba(255,255,255,.12);padding:8px;border-radius:24px;z-index:100;box-shadow:0 10px 40px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.1) inset}
.bn button{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;color:var(--text-3);padding:8px 14px;cursor:pointer;font-size:10px;font-weight:600;letter-spacing:-0.01em;border-radius:16px;transition:all .2s cubic-bezier(.22,1,.36,1);min-width:56px}
.bn button:active{transform:scale(.92)}

.st{display:flex;align-items:center;gap:0;padding:0;background:var(--surface);border-radius:16px;border:.5px solid var(--border);margin-bottom:20px;overflow:hidden}
.st>div{flex:1;padding:14px 8px;text-align:center;position:relative}
.st>div:not(:last-child)::after{content:"";position:absolute;right:0;top:20%;height:60%;width:.5px;background:var(--border)}
.sn{font-size:22px;font-weight:700;letter-spacing:-0.02em;display:block}
.sl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin-top:2px}
.sd{display:none}

.tb{background:var(--surface);border:.5px solid var(--border);color:var(--text-2);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}

.sb{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:18px;margin-bottom:20px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:.5px solid var(--border-2)}
.tr{padding:14px 16px;background:var(--surface);border-radius:14px;border:.5px solid var(--border);margin-bottom:8px;transition:all .2s}
.hc{padding:14px 16px;background:var(--surface);border-radius:14px;border:.5px solid var(--border);margin-bottom:8px}
.sc{padding:14px 16px;background:var(--surface);border-radius:16px;border:.5px solid var(--border);margin-bottom:10px;transition:all .2s}

.pb{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.22,1,.36,1)}

.lb{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);backdrop-filter:blur(20px);z-index:2000;display:none;flex-direction:column;touch-action:pan-y;overflow:hidden}
.lb.open{display:flex;animation:si .3s ease-out forwards}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0));flex-shrink:0}
.lb-close{background:var(--surface-2);border:.5px solid var(--border-2);color:#fff;width:40px;height:40px;border-radius:20px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(20px);transition:all .15s}
.lb-close:active{transform:scale(.92)}
.lb-pg{color:var(--text-2);font-size:15px;font-weight:600}
.lb-body{flex:1;overflow:hidden;position:relative;touch-action:pan-x}
.lb-track{display:flex;height:100%;transition:transform .4s cubic-bezier(.22,1,.36,1);will-change:transform}
.lb-slide{min-width:100%;height:100%;display:flex;align-items:flex-start;justify-content:center;padding:0 12px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.lb-slide img{max-width:100%;height:auto;border-radius:12px;flex-shrink:0;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb-dots{display:flex;justify-content:center;gap:6px;padding:12px 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0));flex-shrink:0}
.lb-dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:all .25s}
.lb-dot.on{background:var(--accent);width:24px}

.srcbox{margin-top:14px;background:var(--surface);border:.5px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .2s}
.srcbox:active{transform:scale(.99)}
.srcl{color:var(--text-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:6px}

.hero{text-align:center;padding:10px 0 28px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.6) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero p{color:var(--text-3);font-size:15px;font-weight:500}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(10,132,255,.2),rgba(10,132,255,.1));border:.5px solid rgba(10,132,255,.3);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 12px;border-radius:100px;margin-bottom:14px}

.mtile{display:flex;align-items:center;gap:16px;width:100%;padding:20px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:.5px solid var(--border-2);text-align:left;cursor:pointer;transition:all .25s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;color:var(--text);margin-bottom:10px}
.mtile:active{transform:scale(.98)}
.mtile-ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.mtile-title{font-size:16px;font-weight:700;letter-spacing:-0.01em;display:block}
.mtile-sub{font-size:13px;color:var(--text-3);margin-top:2px;display:block}
.mtile-arrow{color:var(--text-3);font-size:20px;margin-left:auto;transition:transform .2s}

.sec{font-size:13px;font-weight:700;color:var(--text-2);letter-spacing:.02em;text-transform:uppercase;margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:3px;height:14px;background:linear-gradient(180deg,var(--accent),var(--accent-2));border-radius:2px}

#app{min-height:100vh}

/* ---- Option B ---- */
:root{--blue:10,132,255;--violet:191,90,242;--green:48,209,88;--orange:255,159,10;--t1:rgba(255,255,255,.94);--t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.38);
--din:"DIN Alternate","Bahnschrift","Barlow Semi Condensed",-apple-system,system-ui,sans-serif;--spring:cubic-bezier(.34,1.56,.64,1);--ease2:cubic-bezier(.22,1,.36,1)}
h1,h2,.sn{font-family:var(--din)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border:.5px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.hb{padding-top:6px}
.hb .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hb .title{font:700 34px/1.05 var(--din);letter-spacing:.005em;color:var(--t1)}
.hb .streak{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px 0 9px;border-radius:15px;background:rgba(var(--orange),.12);border:.5px solid rgba(var(--orange),.3);color:rgb(var(--orange));font:700 16px var(--din)}
.hb .streak svg{width:16px;height:16px}
.hb .seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;margin:4px 0 14px}
.hb .seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:9px;background:rgba(255,255,255,.16);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .35s var(--spring)}
.hb .seg[data-v="1"] i{transform:translateX(100%)}
.hb .seg button{position:relative;height:34px;padding:0;font-size:14px;font-weight:600;color:var(--t2);background:none;border:0;border-radius:9px;box-shadow:none;transition:color .2s}
.hb .seg button.on{color:var(--t1);background:none;box-shadow:none}
.hb .resume{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;text-align:left;color:var(--t1);cursor:pointer;transition:transform .2s var(--spring)}
.hb .resume:active{transform:scale(.98)}
.hb .pl{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;background:rgba(var(--green),.16);color:rgb(var(--green));flex-shrink:0}
.hb .pl svg{width:14px;height:14px}
.hb .resume b{display:block;font-size:15.5px;font-weight:600}
.hb .resume small{display:block;color:var(--t2);font-size:13px}
.hb .mini{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}
.hb .mini i{display:block;height:100%;background:rgb(var(--green))}
.hb .chev{width:16px;height:16px;color:var(--t3);flex-shrink:0;margin-left:auto}
.hb .subj{position:relative;isolation:isolate;overflow:hidden;border-radius:26px;padding:22px 20px 20px;margin-top:14px}
.hb .subj::after{content:"";position:absolute;z-index:-1;width:230px;height:230px;right:-80px;top:-100px;border-radius:50%;background:radial-gradient(circle,rgba(var(--c),.5),transparent 70%)}
.hb .subj h2{font:700 40px/1 var(--din);color:var(--t1)}
.hb .subj p{color:var(--t2);margin-top:6px;font-size:15px}
.hb .meta{display:flex;gap:14px;color:var(--t3);font-size:13px;margin-top:3px}
.hb .hbar{height:14px;border-radius:4px;background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.12);overflow:hidden;margin-top:18px}
.hb .hfill{height:100%;transform-origin:left;animation:hgrow 1.1s var(--ease2) .2s both;box-shadow:0 0 16px rgba(var(--c),.5)}
.hb .hatch-a{background:repeating-linear-gradient(135deg,rgb(var(--c)) 0 1.6px,rgba(var(--c),.16) 1.6px 6px)}
.hb .hatch-b{background:repeating-linear-gradient(45deg,rgb(var(--c)) 0 1.6px,transparent 1.6px 4.5px,rgba(var(--c),.6) 4.5px 5.3px,transparent 5.3px 9px),rgba(var(--c),.12)}
.hb .hrow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--t2);margin-top:8px}
.hb .hrow b{color:rgb(var(--c));font:700 16px var(--din);margin-right:4px}
.hb .b2{display:flex;align-items:center;justify-content:center;width:100%;height:46px;border-radius:14px;margin-top:16px;font-size:15px;font-weight:600;color:rgb(var(--c));background:rgba(var(--c),.14);border:.5px solid rgba(var(--c),.35);cursor:pointer;transition:transform .2s var(--spring)}
.hb .b2:active{transform:scale(.97)}
@keyframes hgrow{from{transform:scaleX(0)}}
.dock{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;height:64px;border-radius:24px;display:flex;justify-content:space-around;align-items:center;padding:0 6px;background:rgba(26,26,32,.6);z-index:100;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:0;font-size:10.5px;font-weight:500;color:var(--t3);background:none;border:0;cursor:pointer;transition:transform .2s var(--spring)}
.dock button:active{transform:scale(.9)}
.dock svg{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){.hb .hfill,.hb .seg i,.dock button{animation:none!important;transition:none!important}}

/* ---- Heute üben ---- */
.hb .go{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px 16px;border-radius:18px;border:0;cursor:pointer;text-align:left;color:#fff;background:linear-gradient(180deg,rgba(var(--c),1),rgba(var(--c),.78));box-shadow:0 10px 28px rgba(var(--c),.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .2s var(--spring)}
.hb .go:active{transform:scale(.97)}
.hb .go b{display:block;font:700 19px/1.1 var(--din)}
.hb .go small{display:block;font-size:13px;opacity:.88;margin-top:2px}
.hb .go .gi{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex-shrink:0}
.hb .go svg{width:16px;height:16px}
.hb .seg.seg3{grid-template-columns:repeat(3,1fr)}
.hb .seg.seg3 i{width:calc((100% - 6px)/3)}
.hb .seg.seg3[data-v="2"] i{transform:translateX(200%)}
/* ---- Karteikarten ---- */
.cq-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cq-count{font:700 15px var(--din);color:var(--t2)}
.cq-stage{perspective:1400px;margin:18px 0 16px}
.cq-card{position:relative;touch-action:pan-y;will-change:transform;cursor:pointer}
.cq-inner{display:grid;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .65s var(--spring)}
.cq-inner.fl{transform:rotateY(180deg)}
.cq-face{grid-area:1/1;min-height:300px;border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:linear-gradient(180deg,#1d1d25,#121217);border:.5px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.cq-back{transform:rotateY(180deg);background:linear-gradient(180deg,#16211a,#101512)}
.cq-tag{font:700 12px var(--din);letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.cq-q{font:700 23px/1.28 var(--din);margin:14px 0 18px;color:var(--t1)}
.cq-hint{margin-top:auto;color:var(--t3);font-size:13px}
.cq-a{font:700 23px/1.28 var(--din);color:rgb(var(--green));margin:14px 0 10px}
.cq-ex{color:var(--t2);font-size:15px;line-height:1.5}
.cq-lbl{position:absolute;top:20px;z-index:3;padding:6px 12px;border-radius:10px;font:700 15px var(--din);letter-spacing:.06em;text-transform:uppercase;opacity:0;pointer-events:none;background:rgba(0,0,0,.35)}
.cq-lbl.yes{left:18px;color:rgb(var(--green));border:2px solid rgb(var(--green));transform:rotate(-8deg)}
.cq-lbl.no{right:18px;color:#ff453a;border:2px solid #ff453a;transform:rotate(8deg)}
.cq-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cq-btns .one{grid-column:1/-1}
.cq-b{height:52px;border-radius:16px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s var(--spring)}
.cq-b:active{transform:scale(.97)}
.cq-no{color:#ff453a;background:rgba(255,69,58,.12);border:.5px solid rgba(255,69,58,.35)}
.cq-yes{color:#fff;background:linear-gradient(180deg,#34d65c,#24a948);border:0;box-shadow:0 10px 26px rgba(var(--green),.35)}
.cq-show{color:#fff;background:linear-gradient(180deg,#2b96ff,#0a74e8);border:0;box-shadow:0 10px 26px rgba(var(--blue),.35)}
.cq-help{text-align:center;color:var(--t3);font-size:12.5px;margin-top:2px}
@media (prefers-reduced-motion:reduce){.cq-inner{transition:none}}
.hb .qmd{color:var(--t2);font-size:13.5px;line-height:1.35;margin:-6px 3px 2px;min-height:18px}
.qmf{animation:qmf .35s cubic-bezier(.22,1,.36,1)}@keyframes qmf{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- 3a ---- */
.hb .bg3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hb .b3cta{grid-column:1/3;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:20px;border:0;border-radius:24px;background:var(--accent);color:var(--ink);text-align:left;cursor:pointer;transition:transform .2s var(--spring)}
.hb .b3cta:active{transform:scale(.98)}
.hb .b3cta .k{font-size:13px;font-weight:800;letter-spacing:.06em}

.hb .b3cta .sub{font-size:14px;font-weight:700}
