<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duales Studium">
<meta name="theme-color" content="#0F1012">
<title>Duales Studium</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/geist-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-500.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Karteikasten – dunkel */
@font-face{font-family:"Geist";src:url(fonts/geist-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Geist";src:url(fonts/geist-500.woff2) format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Geist";src:url(fonts/geist-600.woff2) format("woff2");font-weight:600 700;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader-500.woff2) format("woff2");font-weight:500 700;font-style:normal;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{
  --bg:#0F1012;--s0:#141518;--s1:#1A1B1F;--s2:#222328;--s3:#2E2F35;
  --line:#2A2B30;--line2:#232428;
  --t1:#ECECEE;--t2:#9A9CA3;--t3:#6E7078;
  --accent:#7C9BFF;--ink:#0F1012;
  --ok:#5FD08A;--no:#FF7A70;--warn:#F2B85B;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1)
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:15px;line-height:1.4;overflow-x:hidden;overscroll-behavior:none}
input,textarea,button{font-family:inherit;-webkit-appearance:none;appearance:none;color:inherit;font-size:inherit;background:none;border:0}
button{cursor:pointer;text-align:inherit}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}input[type=number]{-moz-appearance:textfield}
svg.i{width:20px;height:20px;flex-shrink:0}
#app{min-height:100vh}

@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,208,138,.45)}70%{box-shadow:0 0 0 10px rgba(95,208,138,0)}100%{box-shadow:0 0 0 0 rgba(95,208,138,0)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes qmf{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.si{animation:si .45s var(--ease) both}
.pulse{animation:pulse .8s cubic-bezier(.4,0,.2,1)}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
.qmf{animation:qmf .35s var(--ease)}

.w{min-height:100vh;padding:calc(12px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px))}
.w.nd{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.ct{max-width:560px;margin:0 auto}

/* Kopfzeile */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 0 18px}
.ph small{display:block;font-size:13px;color:var(--t2);margin-bottom:2px}
.ph h1{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.ph h1.s{font-size:24px}
.ph .lft{display:flex;align-items:center;gap:2px;margin-left:-10px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;font-size:13px;font-weight:500;background:var(--s1);border:1px solid var(--line);color:var(--t2);white-space:nowrap}
.chip svg{width:14px;height:14px;color:var(--accent)}
.note{font-size:13px;color:var(--t2)}
.ok-c{color:var(--ok)}.no-c{color:var(--no)}.wa-c{color:var(--warn)}

/* Buttons */
.b{height:50px;padding:0 20px;border-radius:14px;font-size:16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.005em;transition:transform .15s var(--ease),opacity .2s;white-space:nowrap}
.b:active{transform:scale(.97)}
.b svg{width:18px;height:18px}
.b.off,.b[disabled]{opacity:.4}
.bp{background:var(--t1);color:var(--bg)}
.b2{background:var(--s1);color:var(--t1);border:1px solid var(--line)}
.b.sq{width:50px;padding:0;flex:0 0 50px}
.bs{height:36px;padding:0 12px;border-radius:10px;background:var(--s1);border:1px solid var(--line);color:var(--t1);font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.bs:active{transform:scale(.96)}
.ib{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--t1);flex-shrink:0}
.ib:active{background:var(--s1)}
.ib svg{width:20px;height:20px}
.lk{color:var(--accent);font-size:14px;font-weight:500;min-height:32px;display:inline-flex;align-items:center}
.acts{display:flex;gap:10px;margin-top:16px}
.acts .b{flex:1}
.acts .b.fx{flex:0 0 auto}
.acts .b.sq{flex:0 0 50px}
.acts.stick{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:5;margin-top:18px}
.acts.stick .b{box-shadow:0 10px 28px rgba(0,0,0,.55)}

/* Eingabe */
.qi,.qt{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16px;color:var(--t1);outline:none;transition:border-color .2s,box-shadow .2s}
.qt{min-height:90px;resize:none;line-height:1.5}
.qi::placeholder,.qt::placeholder{color:var(--t3)}
.qi:focus,.qt:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.qi:disabled{opacity:1;-webkit-text-fill-color:var(--t1)}

/* Quiz */
.qh{display:flex;align-items:center;justify-content:space-between;margin:2px -10px 8px}
.qh .c{font-size:14px;color:var(--t2);font-variant-numeric:tabular-nums}
.qh .sc{min-width:44px;display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-right:10px;font-size:14px;color:var(--t2);font-variant-numeric:tabular-nums}
.qh .sc svg{width:14px;height:14px;color:var(--ok)}
.pb{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pf{height:100%;border-radius:2px;background:var(--accent);transition:width .6s var(--ease)}
.kk{position:relative;margin-top:22px;background:var(--s1);border:1px solid var(--s3);border-radius:18px;padding:32px 20px 22px}
.tab{position:absolute;left:20px;top:-1px;height:22px;max-width:calc(100% - 40px);padding:0 10px;border-radius:0 0 7px 7px;background:var(--accent);color:var(--ink);display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.tab span{overflow:hidden;text-overflow:ellipsis}
.qq{font-family:var(--serif);font-size:27px;line-height:1.17;font-weight:500;letter-spacing:-.01em;overflow-wrap:break-word;hyphens:auto}
.qimg{background:#fff;border-radius:12px;padding:12px;margin-top:16px;display:flex;justify-content:center}
.qimg img{width:100%;max-width:260px;display:block}
.ops{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.mc{width:100%;min-height:48px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;text-align:left;font-size:15px;line-height:1.35;color:var(--t1);transition:background .15s}
.mc:active:not(:disabled){background:var(--s1)}
.mc:disabled{cursor:default}
.ml{flex:none;width:22px;height:22px;border-radius:11px;border:1.5px solid #46474E;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ml svg{width:12px;height:12px}
.mc.sel{background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:600}
.mc.sel .ml{background:var(--accent);border-color:var(--accent)}
.mc.sel .ml::after{content:"";width:8px;height:8px;border-radius:4px;background:var(--ink)}
.mc.ok{background:rgba(95,208,138,.14);font-weight:600;color:#fff}
.mc.ok .ml{background:var(--ok);border-color:var(--ok)}
.mc.no{background:rgba(255,122,112,.13);color:#fff}
.mc.no .ml{background:var(--no);border-color:var(--no)}
.mc.dim{color:var(--t2)}
.mc.dim .ml{border-color:#3A3B41}
.inp{margin-top:14px}

/* Boxen */
.bx{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;color:var(--t1)}
.bl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--t2);margin-bottom:6px}
.bl svg{width:14px;height:14px}
.bt{font-size:15px;line-height:1.45}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;letter-spacing:1px;line-height:1.7;word-break:break-word}
.fh{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin-bottom:4px}
.fh .dot{width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.fh .dot svg{width:12px;height:12px}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.kw{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:3px 10px;border-radius:8px;font-size:13px;font-weight:500}
.kw svg{width:12px;height:12px}
.kw.y{background:rgba(95,208,138,.14);color:var(--ok)}
.kw.n{background:rgba(255,122,112,.13);color:var(--no)}
.ans{margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(95,208,138,.10)}
.ans small{display:block;font-size:12px;color:var(--t2);margin-bottom:2px}
.ans b{font-size:16px;font-weight:600;color:var(--ok)}
.ex{font-size:14px;line-height:1.5;color:var(--t2);margin-top:8px}
.crop{display:block;position:relative;width:100%;overflow:hidden;background:#fff;border-radius:8px;margin-top:8px}
.crop img{position:absolute;left:0;top:0;max-width:none}

/* Listen */
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 2px 8px}
.sec>span:first-child{font-size:15px;font-weight:600}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);margin:20px 2px 8px;min-height:32px}
.list{background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list+.list{margin-top:12px}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;border-bottom:1px solid var(--line2);text-align:left;color:var(--t1)}
.row:last-child{border-bottom:0}
button.row:active{background:var(--s2)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tx b{font-size:16px;font-weight:500}
.tx small{font-size:13px;color:var(--t2)}
.chev{width:16px!important;height:16px!important;color:var(--t3);flex-shrink:0;transition:transform .2s}
.mb{width:40px;height:4px;border-radius:2px;background:var(--s3);flex-shrink:0;overflow:hidden;display:block}
.mb i{display:block;height:100%;border-radius:2px;background:var(--t1)}
.ab{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;letter-spacing:.02em;flex-shrink:0;font-style:normal;background:var(--s3);color:var(--t1)}
.ab svg{width:19px;height:19px}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid #46474E;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink)}
.ck svg{width:13px;height:13px}
.row.on .ck{background:var(--accent);border-color:var(--accent)}
.row.offt .tx b{color:var(--t2)}
.pct{font-size:13px;color:var(--t2);font-variant-numeric:tabular-nums;flex-shrink:0}
.stp{display:flex;align-items:center;gap:8px}
.stp b{min-width:92px;text-align:center;font-size:15px;font-weight:500}
.stp .bs{width:36px;padding:0;font-size:18px}

/* Startseite */
.hb .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:11px;background:var(--s1)}
.hb .seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:8px;background:var(--s3);transition:transform .35s var(--spring)}
.hb .seg[data-v="1"] i{transform:translateX(100%)}
.hb .seg[data-v="2"] i{transform:translateX(200%)}
.hb .seg button{position:relative;height:36px;font-size:14px;font-weight:500;color:var(--t2);border-radius:8px;transition:color .2s;text-align:center}
.hb .seg button.on{color:var(--t1)}
.stk{position:relative;margin-top:16px;padding-top:22px}
.stk::before,.stk::after{content:"";position:absolute;height:60px;border-radius:16px;top:4px;left:24px;right:24px;background:var(--s0);border:1px solid #26272C}
.stk::after{top:12px;left:12px;right:12px;background:#17181B;border-color:var(--line)}
.hero{position:relative;z-index:1;background:var(--s1);border:1px solid var(--s3);border-radius:18px;padding:30px 20px 20px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--serif);font-size:36px;line-height:1.05;font-weight:500;letter-spacing:-.01em}
.hero .sub{font-size:14px;color:var(--t2)}
.hero .acts{margin-top:16px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:18px 4px 0}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.wk div.td{color:var(--t1);font-weight:600}
.wk i{width:8px;height:8px;border-radius:4px;background:#24252A;box-sizing:border-box}
.wk i.d{background:var(--t1)}
.wk i.m{background:#3A3B41}
.wk i.t{background:none;border:2px solid var(--accent)}
.res{display:flex;align-items:center;gap:12px;margin-top:14px;width:100%;padding:12px 16px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left;color:var(--t1)}
.res:active{background:var(--s2)}
.res .pl{width:34px;height:34px;border-radius:17px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.res .pl svg{width:13px;height:13px}

/* Schwebende Leiste */
.dock{position:fixed;left:16px;right:16px;bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 8px));max-width:520px;margin:0 auto;height:64px;padding:0 6px;border-radius:24px;background:#1C1D21;border:1px solid var(--s3);box-shadow:0 14px 34px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);display:grid;grid-template-columns:repeat(5,1fr);z-index:100;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dock button{margin:6px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--t2);text-align:center;transition:transform .2s var(--spring),background .2s,color .2s}
.dock button.on{background:#2A2B31;color:var(--accent);font-weight:600}
.dock button:active{transform:scale(.92)}
.dscrub .dock button.on{transform:scale(1.08)}
.dock svg{width:24px;height:24px}

/* Karteikarten */
.cq-stage{perspective:1400px;margin:22px 0 16px}
.cq-card{position:relative;touch-action:pan-y;will-change:transform;cursor:pointer}
.cq-inner{display:grid;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .65s var(--spring)}
.cq-inner.fl{transform:rotateY(180deg)}
.cq-face{position:relative;grid-area:1/1;min-height:320px;border-radius:18px;padding:32px 20px 22px;display:flex;flex-direction:column;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--s1);border:1px solid var(--s3)}
.cq-back{transform:rotateY(180deg)}
.cq-q{font-family:var(--serif);font-size:27px;line-height:1.17;font-weight:500;letter-spacing:-.01em;margin-bottom:16px;overflow-wrap:break-word;hyphens:auto}
.cq-a{font-family:var(--serif);font-size:26px;line-height:1.2;font-weight:500;color:var(--ok);margin-bottom:10px;overflow-wrap:break-word;hyphens:auto}
.cq-ex{color:var(--t2);font-size:15px;line-height:1.5}
.cq-hint{margin-top:auto;color:var(--t2);font-size:13px}
.cq-lbl{position:absolute;top:44px;z-index:3;padding:5px 10px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;background:var(--bg)}
.cq-lbl.yes{left:16px;color:var(--ok);border:1.5px solid var(--ok);transform:rotate(-6deg)}
.cq-lbl.no{right:16px;color:var(--no);border:1.5px solid var(--no);transform:rotate(6deg)}
.cq-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cq-btns .one{grid-column:1/-1}
.cq-help{text-align:center;color:var(--t2);font-size:12.5px}

/* Ergebnis, Profil */
.big-n{font-family:var(--serif);font-size:58px;line-height:1;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cd{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;color:var(--t2)}
.sw{width:26px;height:26px;border-radius:8px;flex-shrink:0}
.cfs{display:flex;gap:2px;flex-shrink:0}
.cfs i{display:block;width:5px;height:22px;border-radius:3px}
.chk{width:20px;height:20px;color:var(--accent);flex-shrink:0}
.lnk{display:block;margin:24px auto 0;color:var(--t2);font-size:14px;text-decoration:underline;min-height:44px}
.page{display:block;width:100%;margin-bottom:14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--s1);text-align:left}
.page span{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;color:var(--t2)}
.page span b{color:var(--t1);font-weight:500}
.page img{width:100%;display:block;min-height:120px;background:#fff}

/* Lightbox */
.lb{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;flex-direction:column;touch-action:pan-y;overflow:hidden}
.lb.open{display:flex;animation:si .3s var(--ease) both}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));flex-shrink:0}
.lb-close{width:44px;height:44px;border-radius:22px;background:var(--s1);border:1px solid var(--line);color:var(--t1);display:flex;align-items:center;justify-content:center}
.lb-close svg{width:20px;height:20px}
.lb-pg{color:var(--t2);font-size:14px;font-variant-numeric:tabular-nums}
.lb-body{flex:1;overflow:hidden;position:relative;touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none}
.lb-track{display:flex;height:100%;transition:transform .4s var(--ease);will-change:transform}
.lb-slide{position:relative;min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:0 12px 8px;overflow:hidden}
.lb-slide img{max-width:100%;max-height:100%;border-radius:10px;flex-shrink:0;transform-origin:0 0;-webkit-user-drag:none;cursor:zoom-in}
.lb-slide img.zm{cursor:grab}
.lb-hint{color:var(--t3)}
.unl{display:flex;gap:8px}.unl .qi{flex:1;min-width:0}.unl .b{flex:0 0 auto}
.lb-dots{display:flex;justify-content:center;gap:6px;padding:12px 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));flex-shrink:0}
.lb-dot{width:6px;height:6px;border-radius:3px;background:#3A3B41;transition:all .25s}
.lb-dot.on{background:var(--accent);width:20px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Hilfsfunktionen ---------- */

function dateDE(){var d=new Date(),W=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"],M=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];return W[d.getDay()]+", "+d.getDate()+". "+M[d.getMonth()]}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- Antwort-Bewertung ---------- */
function norm(s){return s.trim().toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss").replace(/[éèê]/g,"e").replace(/[áàâ]/g,"a").replace(/[^a-z0-9\s]/g,"")}
/* Levenshtein-Distanz, zeilenweise (wenig Speicher) */
function lev(a,b){var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var p=[],c=[],i,j,t;for(j=0;j<=n;j++)p[j]=j;for(i=1;i<=m;i++){c[0]=i;for(j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1));t=p;p=c;c=t}return p[n]}
/* Zahlen aus einem Text, Dezimalkomma wird zu Punkt: "0,06 mm" -> [0.06] */

function numMatch(inp,tgt){var a=nums(inp),b=nums(tgt),k=0;for(var i=0;i<a.length&&k<b.length;i++)if(a[i]===b[k])k++;return b.length>0&&k===b.length}
/* wie norm(), aber Satzzeichen/Bindestriche trennen Wörter: "UV-Strahlen" -> "uv strahlen" */
function normW(s){return norm(String(s).replace(/[^0-9A-Za-z\u00c0-\u017f\s]/g," "))}
/* Kurze Begriffe (bis 3 Zeichen) zählen nur als eigenes Wort, als Wortanfang (bei 3 Zeichen) oder direkt an einer Zahl.
   "Ton" passt zu "Tonboden", nicht zu "Beton"; "öl" nicht zu "Volumen"; "cm" zu "5cm"; "AC" zu "AC16".
   Zusammensetzungen mit dem Begriff am Ende (z.B. "Motoröl") bei Bedarf als eigene Variante eintragen. */
function shortMatch(inp,nt){var t=normW(inp).split(/\s+/),L=nt.length;if(nt.indexOf(" ")>=0)return (" "+t.join(" ")+" ").indexOf(" "+nt+" ")>=0;
for(var i=0;i<t.length;i++){var w=t[i];if(w===nt)return true;if(w.indexOf(nt)===0&&(L===3||/\d/.test(w.charAt(L))))return true;

if(nt.length<=3)return shortMatch(inp,nt);if(ni.indexOf(nt)>=0)return true;

function evalAns(inp,q){var c=inp.trim().toLowerCase();if(!c)return{ok:false,matched:[],missing:[]};

function evalAns2(inp,q){if(q&&q.reject){var ni=" "+norm(inp)+" ";for(var i=0;i<q.reject.length;i++)if(ni.indexOf(" "+norm(q.reject[i])+" ")>=0)return {ok:false,matched:[],missing:[]}}return evalAns(inp,q)}
/* Lückentext: "Splitt (gebrochen)" -> "Sp____ (geb______)" */
function lueck(ans){return ans.split(/([,\s\-()\/]+)/).map(function(p){if(!p||/^[,\s\-()\/]+$/.test(p))return p;if(p.length<=2)return p[0]+"_";if(p.length<=5)return p[0]+new Array(p.length).join("_");var s=Math.ceil(p.length*.3);return p.slice(0,s)+new Array(p.length-s+1).join("_")}).join("")}
function getMC(q){var c=q.answer;if(q.mc&&q.mc.length>=5)return shuffle([c].concat(shuffle(q.mc).slice(0,5)));var pool=[];if(q.mc)pool=pool.concat(q.mc);for(var i=0;i<Q.length;i++){var o=Q[i];if(o.topic===q.topic&&o.id!==q.id&&pool.indexOf(o.answer)<0)pool.push(o.answer)}pool=pool.filter(function(a){return a!==c});return shuffle([c].concat(shuffle(pool).slice(0,5)))}
/* gewichtete Zufallsauswahl: schwache Fragen (hohes Gewicht) kommen öfter */
function wSel(qs,w,n){var pool=qs.map(function(q){return Object.assign({},q,{_w:w[q.id]?w[q.id].weight:1})});var tot=0;for(var i=0;i<pool.length;i++)tot+=pool[i]._w;var sel=[],used={},att=0;while(sel.length<n&&att<n*50){att++;var r=Math.random()*tot;for(var k=0;k<pool.length;k++){var p=pool[k];if(used[p.id])continue;r-=p._w;if(r<=0){sel.push(p);used[p.id]=true;break}}}var sp=shuffle(pool);for(var i2=0;i2<sp.length;i2++)if(!used[sp[i2].id]&&sel.length<n){sel.push(sp[i2]);used[sp[i2].id]=true}return shuffle(sel)}

/* ---------- Aussehen ---------- */
var THEMES={default:{name:"Blau",accent:"#7C9BFF"},lila:{name:"Lila",accent:"#B79CFF"},rosa:{name:"Rosa",accent:"#F49AC1"},orange:{name:"Orange",accent:"#F5A06B"},gruen:{name:"Grün",accent:"#6FD39A"},lime:{name:"Lime",accent:"#C6F432"}};

function fireConf(cols){var c=document.getElementById("confetti"),x=c.getContext("2d");c.width=window.innerWidth;c.height=window.innerHeight;var ps=[];for(var i=0;i<80;i++)ps.push({x:c.width/2,y:c.height/2,vx:(Math.random()-.5)*12,vy:Math.random()*-14-4,sz:Math.random()*6+3,col:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*360,rv:(Math.random()-.5)*10,life:1,dec:Math.random()*.015+.008});(function draw(){x.clearRect(0,0,c.width,c.height);var alive=0;for(var i=0;i<ps.length;i++){var p=ps[i];if(p.life<=0)continue;alive++;p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.rot+=p.rv;p.life-=p.dec;x.save();x.translate(p.x,p.y);x.rotate(p.rot*Math.PI/180);x.globalAlpha=p.life;x.fillStyle=p.col;x.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.6);x.restore()}if(alive>0)requestAnimationFrame(draw);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- Zustand & Speicher ---------- */

var S={tab:"home",mode:"modesel",qMode:"text",topics:{},qSize:10,weights:null,history:[],streak:{count:0,lastDate:null},prestige:defP(),session:null,
qs:[],cur:0,input:"",confirmed:false,result:null,score:0,wrong:[],showHint:false,hints:0,retypeMode:false,retypeInput:"",retypeDone:false,retypeMissing:[],mcOpts:[],mcSel:null,retryRound:false,flip:false,

  for(var i=0;i<TOPICS.length;i++)S.topics[TOPICS[i].id]=true;
  var w=ld(KW,defW),dw=defW();for(var id in dw)if(!w[id])w[id]=dw[id];S.weights=w;
  S.history=ld(KH,[]);S.streak=ld(KS,{count:0,lastDate:null});S.prestige=Object.assign(defP(),ld(KP,defP));S.session=ld(KSE,null);
  var qm=null;try{qm=localStorage.getItem(KQM)}catch(e){}if(qm==="mc"||qm==="text"||qm==="card")S.qMode=qm;
  S.days=ld(KD,null);
  if(!S.days){S.days={};var n=(S.streak&&S.streak.count)||0;if(n&&S.streak.lastDate){var d=new Date(S.streak.lastDate+"T12:00:00");for(var k=0;k<n;k++){S.days[ymd(d)]=1;d.setDate(d.getDate()-1)}}sv(KD,S.days)}

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
